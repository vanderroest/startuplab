<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5B2EFF">
<meta name="description" content="StartupLab – Bouw stap voor stap je eigen bedrijf">
<title>StartupLab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E">
<style>
:root{
  --c1:#5B2EFF; --c2:#FF5A1F; --c3:#FFD60A;
  --on1:#ffffff; --on2:#ffffff; --on3:#17132B;
  --c1-soft:#ECE6FF; --c2-soft:#FFE6DC; --c3-soft:#FFF6C7;
  --bg:#F3F0FF; --card:#ffffff; --ink:#17132B; --muted:#55516A; --line:#17132B;
  --ok:#0E9F57; --warn:#E5484D; --bar:#FF8A00;
  --font-head:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --font-body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:18px; --shadow:0 4px 0 var(--line);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;overflow-x:hidden;transition:background .4s}
img{max-width:100%}
h1,h2,h3,h4,.head{font-family:var(--font-head);line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(1.8rem,5vw,2.6rem)} h2{font-size:clamp(1.4rem,4vw,1.9rem)} h3{font-size:1.2rem}
p{margin:.3em 0 .8em}
a{color:inherit}
:focus-visible{outline:4px solid var(--c3);outline-offset:2px;box-shadow:0 0 0 7px var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.88rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem}
.stack>*+*{margin-top:1rem}

/* knoppen */
.btn{font:700 1rem var(--font-head);display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:48px;padding:.6rem 1.15rem;border-radius:14px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;text-decoration:none;transition:transform .12s,box-shadow .12s;text-align:center}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--shadow)}
.btn.p{background:var(--c1);color:var(--on1)} .btn.s{background:var(--c2);color:var(--on2)} .btn.a{background:var(--c3);color:var(--on3)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn.big{font-size:1.25rem;min-height:64px;padding:.8rem 1.6rem;border-radius:18px}
.btn.sm{min-height:38px;padding:.3rem .8rem;font-size:.9rem;border-width:2px;box-shadow:0 3px 0 var(--line)}
.btn.danger{background:var(--warn);color:#fff}
.btn.final{background:var(--ok);color:#fff;font-size:1.15rem;min-height:58px}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:1.1rem}

/* kaarten */
.card{background:var(--card);border:2.5px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tint1{background:var(--c1-soft)} .card.tint2{background:var(--c2-soft)} .card.tint3{background:var(--c3-soft)}
.card.hero{background:var(--c1);color:var(--on1)}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .65rem;border-radius:99px;border:2px solid var(--line);font-weight:700;font-size:.85rem;background:var(--card);color:var(--ink)}
.pill.ok{background:#D8F7E6} .pill.warn{background:#FFE1E1} .pill.c{background:var(--c3);color:var(--on3)}

/* layout */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;background:var(--c1);color:var(--on1);border-bottom:3px solid var(--line)}
.wordmark{font:900 1.35rem var(--font-head);letter-spacing:-.5px;display:flex;align-items:center;gap:.4rem;text-decoration:none;color:inherit;white-space:nowrap}
.wordmark .rk{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--c3);color:var(--on3);border:2px solid var(--line);font-size:1.1rem}
.topbar .proj{font-weight:700;opacity:.95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.savestat{font-size:.82rem;font-weight:700;padding:.2rem .6rem;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
.topbar .iconbtn{background:var(--card);color:var(--ink)}
.demobar{background:var(--c3);color:var(--on3);border-bottom:3px solid var(--line);padding:.45rem 1rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:1.4rem;max-width:1320px;margin:0 auto;padding:1.2rem 1rem 7rem}
@media(min-width:1100px){.layout.withcard{grid-template-columns:minmax(0,1fr) 320px}}
.aside{display:none}
@media(min-width:1100px){.aside{display:block;position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}}
.cardbtn{display:inline-flex}
@media(min-width:1100px){.cardbtn{display:none}}
main:focus{outline:none}

/* menu */
.menu{position:absolute;right:1rem;top:62px;background:var(--card);color:var(--ink);border:2.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:.5rem;min-width:250px;z-index:50}
.menu button{display:flex;width:100%;gap:.6rem;align-items:center;background:none;border:0;padding:.7rem .8rem;border-radius:10px;font:600 1rem var(--font-body);color:var(--ink);cursor:pointer;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--c1-soft)}
.menu hr{border:0;border-top:2px dashed #ccc;margin:.3rem 0}

/* drawer */
.drawer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(23,19,43,.45)}
.drawer>div{width:min(360px,92vw);height:100%;overflow:auto;background:var(--bg);border-left:3px solid var(--line);padding:1rem}

/* formulieren */
.fld{display:block;margin:0 0 1rem}
.fld>span,.lbl{display:block;font-weight:700;margin-bottom:.3rem}
.fld small,.hint{display:block;color:var(--muted);font-size:.88rem;margin:-.15rem 0 .35rem}
input[type=text],input[type=number],input[type=date],input:not([type]),textarea,select{width:100%;font:1rem var(--font-body);color:var(--ink);padding:.7rem .85rem;border:2.5px solid var(--line);border-radius:12px;background:#fff;min-height:48px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--c1);box-shadow:0 0 0 4px var(--c3)}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset[disabled] input,fieldset[disabled] textarea,fieldset[disabled] select{background:#f2f1f6;color:#333}
.choice{display:flex;flex-wrap:wrap;gap:.5rem}
.choice label{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem .9rem;border:2.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:600;min-height:44px}
.choice input{width:20px;height:20px;accent-color:var(--c1);margin:0}
.choice label:has(input:checked){background:var(--c1);color:var(--on1)}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.4rem}
.checkgrid label{display:flex;gap:.45rem;align-items:center;font-size:.93rem;padding:.35rem .5rem;border-radius:10px;border:2px solid #d9d6e6;background:#fff;cursor:pointer}
.checkgrid label:has(input:checked){border-color:var(--ok);background:#E6F9EE}
.checkgrid input{width:18px;height:18px;accent-color:var(--ok)}
.item{border:2.5px dashed var(--line);border-radius:16px;padding:1rem;margin-bottom:1rem;background:#fff;position:relative}
.item h4{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.counter{font-weight:800;font-size:.9rem}
.counter.over{color:var(--warn)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{font:700 1rem var(--font-head);padding:.55rem 1rem;border-radius:99px;border:2.5px solid var(--line);background:#fff;cursor:pointer;min-height:44px;transition:transform .12s}
.chip:hover{transform:rotate(-2deg) scale(1.04)}
.chip[aria-pressed=true]{background:var(--c1);color:var(--on1);box-shadow:var(--shadow)}

/* opdrachtkop */
.taskhead{display:flex;gap:1rem;align-items:flex-start;margin-bottom:1rem}
.tasknum{flex:none;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--c3);color:var(--on3);border:3px solid var(--line);font:900 1.7rem var(--font-head);box-shadow:var(--shadow);transform:rotate(-4deg)}
.status{display:inline-flex;gap:.35rem;align-items:center;font-weight:800;font-size:.9rem;padding:.15rem .6rem;border-radius:99px;border:2px solid var(--line);background:#fff}
.status.final{background:#D8F7E6} .status.concept{background:#FFF3C4} .status.recheck{background:#FFE1E1} .status.locked{background:#e7e5ee;color:#555}
.stepper{display:flex;gap:.3rem;overflow-x:auto;padding:.3rem .1rem .7rem;margin-bottom:.6rem;scrollbar-width:thin}
.stepper a{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;border:2.5px solid var(--line);background:#fff;font-weight:800;text-decoration:none;font-size:.9rem}
.stepper a.final{background:var(--c1);color:var(--on1)} .stepper a.concept{background:var(--c3);color:var(--on3)}
.stepper a.recheck{background:var(--warn);color:#fff} .stepper a.locked{opacity:.4;border-style:dashed}
.stepper a.cur{transform:scale(1.18);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--line)}
.missing{border-left:6px solid var(--c2);background:var(--c2-soft);border-radius:12px;padding:.7rem 1rem}
.missing ul{margin:.3rem 0 0;padding-left:1.2rem}
.donebox{border:3px solid var(--ok);background:#E9FBF1;border-radius:16px;padding:1rem}
.banner{border:2.5px solid var(--line);border-radius:14px;padding:.8rem 1rem;background:var(--c3-soft);display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.banner.warn{background:#FFE1E1}
.example{border:2.5px dashed var(--c1);border-radius:14px;padding:.8rem 1rem;background:var(--c1-soft)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.tab{font:800 1rem var(--font-head);padding:.55rem 1rem;border-radius:14px 14px 4px 4px;border:2.5px solid var(--line);background:#fff;cursor:pointer;min-height:46px}
.tab[aria-selected=true]{background:var(--c1);color:var(--on1);transform:translateY(-3px);box-shadow:var(--shadow)}
.tab[disabled]{opacity:.45;cursor:not-allowed}

/* dashboard */
.dashhero{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.dashhero{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.bar{height:26px;border-radius:99px;border:2.5px solid var(--line);background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .6s;background:var(--bar)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
.tile{display:flex;flex-direction:column;gap:.3rem;align-items:flex-start;text-align:left;padding:1rem;border-radius:18px;border:2.5px solid var(--line);background:#fff;box-shadow:var(--shadow);cursor:pointer;font:inherit;color:inherit;min-height:110px;transition:transform .12s}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile .em{font-size:1.8rem}
.tile b{font-family:var(--font-head);font-size:1.05rem}
.tile.locked{opacity:.6;border-style:dashed}
.members{display:flex;flex-wrap:wrap;gap:.5rem}
.member{display:flex;gap:.5rem;align-items:center;padding:.35rem .7rem .35rem .35rem;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--c3);color:var(--on3);border:2px solid var(--line)}
.expertblock{background:var(--c2);color:var(--on2);border:3px solid var(--line);border-radius:22px;padding:1.3rem;box-shadow:0 6px 0 var(--line)}

/* stickers */
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:.7rem}
.sticker{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:.5rem;font:800 .75rem/1.15 var(--font-head);border:3px solid var(--line);background:var(--c3);color:var(--on3);box-shadow:var(--shadow)}
.sticker .em{font-size:1.6rem;display:block}
.sticker:nth-child(3n){transform:rotate(6deg);background:var(--c2);color:var(--on2)}
.sticker:nth-child(3n+1){transform:rotate(-5deg);background:var(--c1);color:var(--on1)}
.sticker.empty{background:transparent!important;color:var(--muted)!important;border-style:dashed;box-shadow:none;transform:none}
.badges{display:flex;gap:.6rem;flex-wrap:wrap}
.badge{display:flex;flex-direction:column;align-items:center;gap:.2rem;width:96px;text-align:center;font:800 .78rem var(--font-head)}
.badge .shape{width:70px;height:78px;display:grid;place-items:center;font-size:1.9rem;background:var(--c3);border:3px solid var(--line);clip-path:polygon(50% 0,100% 22%,100% 75%,50% 100%,0 75%,0 22%)}
.badge.off .shape{background:#e2e0ea;filter:grayscale(1);opacity:.6}

/* route */
.route{list-style:none;margin:1rem 0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:50%;top:20px;bottom:20px;border-left:6px dashed var(--line);transform:translateX(-50%);opacity:.25}
.route li{display:flex;margin-bottom:.4rem;position:relative}
.route li:nth-child(odd){justify-content:flex-start} .route li:nth-child(even){justify-content:flex-end}
.station{display:flex;gap:.8rem;align-items:center;width:min(100%,430px);padding:.8rem 1rem;border-radius:20px;border:2.5px solid var(--line);background:#fff;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .15s}
.station:hover{transform:scale(1.03)}
.station .dot{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);font:900 1.3rem var(--font-head);background:#fff}
.station.final .dot{background:var(--c1);color:var(--on1)} .station.concept .dot{background:var(--c3);color:var(--on3)}
.station.recheck .dot{background:var(--warn);color:#fff} .station.locked{opacity:.55;border-style:dashed;box-shadow:none}
@media(max-width:600px){.route::before{left:30px}.route li{justify-content:flex-start!important}}

/* uploads */
.upl{border:2.5px solid var(--line);border-radius:18px;padding:1rem;background:#fff;margin-bottom:1rem}
.upl.locked{background:repeating-linear-gradient(45deg,#f4f3f8,#f4f3f8 10px,#eceaf3 10px,#eceaf3 20px)}
.drop{display:flex;flex-direction:column;align-items:center;gap:.3rem;border:3px dashed var(--c1);border-radius:14px;padding:1rem;text-align:center;cursor:pointer;background:var(--c1-soft);font-weight:700}
.drop.over{background:var(--c3)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem;margin-top:.8rem}
.file{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column;position:relative}
.file.isfinal{border:4px solid var(--ok)}
.thumb{aspect-ratio:4/3;background:#f2f0f8;display:grid;place-items:center;overflow:hidden;cursor:pointer;border:0;padding:0;width:100%}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .doc{font-size:2.6rem}
.file .meta{padding:.5rem;font-size:.82rem;display:flex;flex-direction:column;gap:.3rem}
.file .meta input{min-height:36px;padding:.35rem .5rem;font-size:.85rem;border-width:2px}
.fmenu{position:absolute;right:6px;top:6px}
.fmenu>button{background:#fff;border:2px solid var(--line);border-radius:10px;min-width:36px;min-height:36px;font-weight:900;cursor:pointer}
.fmenu .menu{top:40px;right:0;min-width:180px}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:.05rem .45rem;border-radius:6px;background:var(--c3);color:var(--on3);border:1.5px solid var(--line)}
.tag.ai{background:#2B2B2B;color:#fff} .tag.fin{background:var(--ok);color:#fff}
.owncheck{border:3px solid var(--line);border-radius:16px;padding:1rem;background:var(--c3-soft);margin-bottom:1rem}
.owncheck .ln{display:flex;gap:.6rem;align-items:center;padding:.35rem 0;font-weight:600}
.owncheck .ln input{width:22px;height:22px;accent-color:var(--ok)}
.owncheck .auto{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;background:#fff}
.owncheck .auto.on{background:var(--ok);color:#fff}

/* huisstijl */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:.4rem;margin:.5rem 0 1rem}
.sw{aspect-ratio:1;border-radius:12px;border:2.5px solid var(--line);cursor:pointer;min-height:44px}
.sw:hover{transform:scale(1.1)}
.rolepick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin-bottom:.6rem}
.role{border:2.5px solid var(--line);border-radius:14px;padding:.5rem;background:#fff;cursor:pointer;text-align:center;font:700 .9rem var(--font-head)}
.role .c{height:42px;border-radius:9px;border:2px solid var(--line);margin-bottom:.35rem}
.role[aria-pressed=true]{box-shadow:0 0 0 4px var(--c3),var(--shadow);transform:translateY(-2px)}
.fonts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
@media(max-width:560px){.fonts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fonttile{border:2.5px solid var(--line);border-radius:16px;padding:.8rem .6rem;background:#fff;cursor:pointer;text-align:center;min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:.25rem}
.fonttile .nm{font-size:1.35rem;overflow-wrap:anywhere;line-height:1.1}
.fonttile[aria-pressed=true]{background:var(--c1);color:var(--on1);box-shadow:var(--shadow)}
.preview{border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--pbg);box-shadow:var(--shadow);font-family:var(--font-body)}
.preview .pt{background:var(--pc1);color:var(--pon1);padding:.6rem .8rem;font:800 1rem var(--pfont);display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid var(--line)}
.preview .pb{padding:.8rem}
.preview .ph{font:800 1.4rem var(--pfont);margin:0 0 .3rem;color:var(--ink)}
.preview .pbtn{display:inline-block;padding:.45rem .8rem;border-radius:10px;border:2px solid var(--line);font:700 .9rem var(--pfont);margin:.2rem .3rem .2rem 0}
.preview .pbar{height:14px;border:2px solid var(--line);border-radius:99px;background:#fff;overflow:hidden;margin:.6rem 0}
.preview .pbar i{display:block;height:100%;width:60%;background:var(--pc1)}
.preview .pcard{background:#fff;border:2px solid var(--line);border-radius:12px;padding:.5rem .7rem;font-size:.85rem}
.colorrow{display:flex;gap:.4rem}
.colorrow span{flex:1;height:46px;border-radius:10px;border:2.5px solid var(--line)}
.split{display:grid;gap:1.2rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.split{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}.split .sticky{position:sticky;top:80px;align-self:start}}

/* bedrijfskaart */
.bcard{background:var(--card);border:3px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.bcard .top{background:var(--c1);color:var(--on1);padding:1rem;display:flex;gap:.7rem;align-items:center}
.bcard .top .lg{width:56px;height:56px;border-radius:14px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.bcard .top .lg img{width:100%;height:100%;object-fit:contain}
.bcard dl{margin:0;padding:.8rem 1rem}
.bcard dt{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:.55rem}
.bcard dd{margin:0;font-size:.95rem}
.nf{color:var(--muted);font-style:italic;font-size:.88rem}

/* Nova */
.nova{position:fixed;right:14px;bottom:14px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;max-width:calc(100vw - 28px)}
.novabtn{width:72px;height:72px;border-radius:50%;border:3px solid var(--line);background:var(--c3);cursor:pointer;box-shadow:var(--shadow);padding:0;display:grid;place-items:center;position:relative}
.novabtn .ping{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--c2);border:2px solid var(--line);color:var(--on2);font:900 .8rem var(--font-head);display:grid;place-items:center}

<body>

<noscript><p style="padding:2rem;font-size:1.2rem">StartupLab heeft JavaScript nodig. Zet JavaScript aan in je browser.</p></noscript>
<script>
'use strict';
/* ================= HULPFUNCTIES ================= */
const $ = (s, el = document) => el.querySelector(s);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const blank = v => v == null || (typeof v === 'string' && v.trim() === '') || (Array.isArray(v) && v.length === 0);
const words = s => String(s || '').trim().split(/\s+/).filter(Boolean).length;
function getP(obj, path) { return String(path).split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }

  const ks = String(path).split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { const k = ks[i]; if (o[k] == null || typeof o[k] !== 'object') o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[k]; }
  o[ks[ks.length - 1]] = val;
}
const fmtTime = t => t ? new Date(t).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : '';

const euro = v => (v === '' || v == null || isNaN(+v)) ? '' : '€' + (+v).toFixed(2).replace('.', ',');
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= KLEUR ================= */
function hexOk(h) { return /^#[0-9a-f]{6}$/i.test(h || ''); }
function hexRgb(h) { h = (h || '#000000').replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); }
function lum(h) { return hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }).reduce((a, v, i) => a + v * [.2126, .7152, .0722][i], 0); }

/* ================= VEILIGE OPSLAG ================= */
/* Als de browser opslag blokkeert (voorbeeldvenster, strenge instellingen), werkt de app in het geheugen verder. */
const MEM = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return k in MEM ? MEM[k] : null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { if (e && e.name === 'QuotaExceededError') throw e; MEM[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } delete MEM[k]; }
};

/* ================= STATE ================= */
const DATA_VERSION = 4;
const LS = m => 'startuplab:' + m;
const ACTIVE = 'startuplab:active';
const APP = { mode: null, s: null, novaOpen: false, novaIdx: 0, novaTask: null, tab8: 'A', role8: 'c1', pmSlide: 0, filesFilter: 'all' };
const S = () => APP.s;

function newState(team) {
  const progress = {}; for (let i = 1; i <= 15; i++) progress[i] = 'none';
  return {
    meta: { app: 'StartupLab', dataVersion: DATA_VERSION, created: Date.now(), lastSaved: null, isDemo: false },
    team,
    ui: { lastConcept: null, maxReached: 1, lastBackup: null, expertOpen: false, novaSeen: {} },
    progress, sub8: { A: 'none', B: 'none', C: 'none', D: 'none' }, recheck: {},
    milestones: {}, concept: {}, final: {}, uploadIndex: {}, ownWorkChecks: {},
    chatbotHistory: [], expertMissions: {}, badges: {}

}
function migrate(s) {
  if (!s || typeof s !== 'object') return null;
  if (!s.meta) s.meta = { app: 'StartupLab' };
  if ((s.meta.dataVersion || 3) < 4) {
    const t = s.team || {}; const members = [];
    [1, 2, 3].forEach(i => { if (t['student' + i]) members.push({ name: t['student' + i], title: t['title' + i] || '' }); });
    s.team = { members: members.length ? members : [{ name: 'Leerling', title: '' }], className: t.className || '', temporaryProjectName: t.temporaryProjectName || 'Mijn project' };

  const base = newState(s.team);
  for (const k of Object.keys(base)) if (s[k] == null) s[k] = base[k];

  return s;
}
const isSolo = () => (S()?.team?.members?.length || 2) === 1;
/* aanspreekvorm: W('jullie','je') */
const W = (team, solo) => isSolo() ? solo : team;
const Wc = (team, solo) => { const v = W(team, solo); return v.charAt(0).toUpperCase() + v.slice(1); };
const F = () => S().final;
const C = n => { const s = S(); if (!s.concept['t' + n]) s.concept['t' + n] = {}; return s.concept['t' + n]; };
const companyName = () => F().t7?.name || S().team.temporaryProjectName || 'StartupLab-project';

/* ================= OPSLAG ================= */
const DB = {
  db: null, mem: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      let r; try { r = indexedDB.open('startuplab', 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('files', mode); const st = t.objectStore('files'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  put(k, v) { if (this.mem) { this.mem.set(k, v); return Promise.resolve(); } return this.tx('readwrite', st => st.put(v, k)); },
  get(k) { if (this.mem) return Promise.resolve(this.mem.get(k)); return this.tx('readonly', st => st.get(k)); },
  del(k) { if (this.mem) { this.mem.delete(k); return Promise.resolve(); } return this.tx('readwrite', st => st.delete(k)); },
  async keys() { if (this.mem) return [...this.mem.keys()]; const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('files').objectStore('files').getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
};
const fkey = id => APP.mode + ':' + id;

let saveTimer = null;
function save(now) {
  setSave('busy');
  clearTimeout(saveTimer);
  const run = () => {
    try {
      S().meta.lastSaved = Date.now();
      store.set(LS(APP.mode), JSON.stringify(S()));
      saveTimer = null; setSave('ok');
    } catch (e) { console.error(e); setSave('fail'); }
  };
  if (now) run(); else saveTimer = setTimeout(run, 350);
}
function setSave(st) {
  const el = $('#savestat'); const live = $('#live');
  const txt = st === 'busy' ? 'Bezig met opslaan…' : st === 'fail' ? 'Opslaan mislukt. Download een back-up.' : 'Alles opgeslagen · ' + fmtTime(S()?.meta?.lastSaved);
  if (el) { el.textContent = st === 'ok' ? '✓ Opgeslagen ' + fmtTime(S().meta.lastSaved) : st === 'busy' ? '… opslaan' : '⚠ Opslaan mislukt'; el.title = txt; }
  if (st !== 'busy' && live) live.textContent = txt;
  if (st === 'fail') toast('⚠ Opslaan mislukt. Download een back-up via het menu.');
}
function loadMode(mode) {
  try { const raw = store.get(LS(mode)); return raw ? migrate(JSON.parse(raw)) : null; } catch (e) { return null; }
}
async function checkStorage() {
  try { await Promise.race([DB.open(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 2000))]); const k = '__test__'; await DB.put(k, new Blob(['x'])); await DB.del(k); APP.noIDB = false; }
  catch (e) { APP.noIDB = true; }
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { APP.noLS = true; }

}
async function askPersist() { try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch (e) { } }

/* ================= THEMA ================= */
const BASE_THEME = { c1: '#5B2EFF', c2: '#FF5A1F', c3: '#FFD60A', font: null };
const FONTS = [
  ['Arial', 'duidelijk', 'Arial,Helvetica,sans-serif'],
  ['Arial Black', 'krachtig', '"Arial Black","Arial Bold",Gadget,sans-serif'],
  ['Georgia', 'klassiek', 'Georgia,"Times New Roman",serif'],
  ['Trebuchet MS', 'vriendelijk', '"Trebuchet MS",Helvetica,sans-serif'],
  ['Verdana', 'toegankelijk', 'Verdana,Geneva,sans-serif'],
  ['Courier New', 'technisch', '"Courier New",Courier,monospace'],
  ['Times New Roman', 'traditioneel', '"Times New Roman",Times,serif'],
  ['Impact', 'opvallend', 'Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif'],
  ['Comic Sans MS', 'speels', '"Comic Sans MS","Comic Sans","Chalkboard SE",cursive']

const fontStack = name => (FONTS.find(f => f[0] === name) || [])[2] || '"Trebuchet MS","Segoe UI",system-ui,sans-serif';
function themeVars(c1, c2, c3) {
  return { '--c1': c1, '--c2': c2, '--c3': c3, '--on1': onColor(c1), '--on2': onColor(c2), '--on3': onColor(c3), '--c1-soft': mix(c1, '#fff', .86), '--c2-soft': mix(c2, '#fff', .86), '--c3-soft': mix(c3, '#fff', .8), '--bg': mix(c1, '#fff', .92) };
}
function applyTheme() {
  const t8 = S() && F().t8; const r = document.documentElement.style;

  const v = themeVars(th.c1, th.c2, th.c3);
  for (const k in v) r.setProperty(k, v[k]);

function ownCheck(key, owner, ownSlots) {
  const s = S(); if (!s.ownWorkChecks[key]) s.ownWorkChecks[key] = {};
  const c = s.ownWorkChecks[key];
  const hasOwn = Object.values(s.uploadIndex).some(m => m.owner === owner && ownSlots.includes(m.slot));
  const ok = c.a && c.b && c.c && hasOwn;
  const dis = isFinalOwner(owner) ? 'disabled' : '';
  const ln = (k, t) => `<label class="ln"><input type="checkbox" data-own="${key}.${k}" ${c[k] ? 'checked' : ''} ${dis}> ${t}</label>`;
  return {
    ok, html: `<div class="owncheck"><h3 style="margin:0 0 .3rem">${ok ? '✅' : '🧠'} Eerst zelf!</h3><p class="small">Digitale en AI-versies gaan pas open als alles hieronder groen is.</p>

    ${ln('b', W('Wij hebben eerst zelf een schets, ontwerp of model gemaakt', 'Ik heb eerst zelf een schets, ontwerp of model gemaakt'))}
    ${ln('c', W('Wij begrijpen dat AI ons eigen denkwerk niet vervangt', 'Ik begrijp dat AI mijn eigen denkwerk niet vervangt'))}
    <div class="ln"><span class="auto ${hasOwn ? 'on' : ''}" aria-hidden="true">${hasOwn ? '✓' : ''}</span> Eigen werk geüpload <span class="small muted">(${hasOwn ? 'klaar' : 'gaat vanzelf aan na een upload'})</span></div></div>`
  };
}

  g6: { label: '6 vakjes', cols: 3, rows: 2 },

function mbRects(layout) {
  const L = MB_LAYOUTS[layout] || MB_LAYOUTS.g9;
  if (L.rects) return L.rects;
  const out = []; const w = 4 / L.cols, h = 3 / L.rows;
  for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++) out.push([c * w, r * h, w, h]);
  return out;
}

/* ---------- afbeelding maken met canvas ---------- */
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
function fitText(ctx, text, maxW, maxH, family) {
  const wordsArr = String(text).split(/\s+/);
  for (let size = Math.floor(maxH * 0.42); size >= 14; size -= 2) {
    ctx.font = `bold ${size}px ${family}`;
    const lines = []; let line = '';
    for (const w of wordsArr) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width <= maxW) line = t; else { if (line) lines.push(line); line = w; } }
    if (line) lines.push(line);
    if (lines.every(l => ctx.measureText(l).width <= maxW) && lines.length * size * 1.15 <= maxH) return { size, lines };
  }
  ctx.font = `bold 14px ${family}`; return { size: 14, lines: [text] };
}
async function mbRenderPNG(c) {
  const mb = c.mb; const rects = mbRects(mb.layout);
  const W0 = 1600, H0 = 1200, gap = 14, u = W0 / 4;
  const cv = document.createElement('canvas'); cv.width = W0; cv.height = H0; const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W0, H0);
  const family = c.font ? fontStack(c.font) : '"Trebuchet MS",Arial,sans-serif';
  for (let i = 0; i < rects.length; i++) {
    const [rx, ry, rw, rh] = rects[i]; const x = rx * u + gap / 2, y = ry * u + gap / 2, w = rw * u - gap, h = rh * u - gap;
    const cell = mb.cells[i] || {};
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    if (!cellFilled(cell)) { ctx.fillStyle = '#F1EFF6'; ctx.fillRect(x, y, w, h); }
    else if (cell.type === 'kleur') { ctx.fillStyle = cell.color; ctx.fillRect(x, y, w, h); }
    else if (cell.type === 'foto') {
      ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, h);
      try { const im = await loadImg(await fileUrl(cell.fileId)); const s = Math.max(w / im.naturalWidth, h / im.naturalHeight); const dw = im.naturalWidth * s, dh = im.naturalHeight * s; ctx.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); } catch (e) { }
    } else if (cell.type === 'woord') {
      ctx.fillStyle = hexOk(cell.bg) ? cell.bg : '#ffffff'; ctx.fillRect(x, y, w, h);
      const { size, lines } = fitText(ctx, cell.text, w * 0.86, h * 0.86, family);
      ctx.fillStyle = hexOk(cell.color) ? cell.color : '#17132B'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `bold ${size}px ${family}`;
      const lh = size * 1.15; const top = y + h / 2 - (lines.length - 1) * lh / 2;

    }

  }

}

/* ---------- route ---------- */
function viewRoute() {
  let h = `<h1>🗺️ Projectroute</h1><p>15 stations naar ${W('jullie', 'je')} eigen bedrijf. Tik op een station om erheen te gaan.</p><ol class="route">`;
  for (let i = 1; i <= 15; i++) { const st = stat(i); h += `<li><a class="station ${st}" href="#/opdracht/${i}" ${st === 'locked' ? 'aria-disabled="true"' : ''}><span class="dot">${st === 'final' ? '✓' : i}</span><span><b class="head">${TASKS[i].emoji} ${i}. ${TASKS[i].title()}</b><br>${statusPill(st)}</span></a></li>`; }
  h += `<li><a class="station ${S().ui.expertOpen ? '' : 'locked'}" href="#/expert"><span class="dot">🏅</span><span><b class="head">Expertzone</b><br>${S().ui.expertOpen ? '<span class="status">Open</span>' : statusPill('locked')}</span></a></li></ol>`;
  return h;
}
function stepper(cur) {
  let h = '<nav class="stepper no-print" aria-label="Projectnavigator">';
  for (let i = 1; i <= 15; i++) { const st = stat(i); h += `<a href="#/opdracht/${i}" class="${st} ${i === cur ? 'cur' : ''}" aria-label="Opdracht ${i}: ${TASKS[i].short}, ${STAT[st][1]}" ${i === cur ? 'aria-current="step"' : ''} title="${i}. ${TASKS[i].short} – ${STAT[st][1]}">${st === 'final' ? '✓' : st === 'recheck' ? '!' : i}</a>`; }
  return h + '</nav>';
}

/* ---------- opdracht ---------- */
function viewTask(n) {
  const def = TASKS[n]; const st = stat(n); const s = S();
  let h = stepper(n) + `<div class="taskhead"><div class="tasknum" aria-hidden="true">${n}</div><div style="min-width:0"><p class="small muted" style="margin:0">Opdracht ${n} van 15</p><h1 style="margin:.1rem 0 .3rem">${def.emoji} ${def.title()}</h1>${statusPill(st)}</div></div>`;
  if (st === 'locked') {
    let prev = n - 1; while (prev > 1 && S().progress[prev] === 'final') prev--;
    return h + `<div class="card tint2"><h2>🔒 Nog op slot</h2><p>Deze opdracht gaat open als opdracht ${n - 1} definitief is.</p><a class="btn p" href="#/opdracht/${s.ui.maxReached}">Naar opdracht ${s.ui.maxReached}</a></div>`;
  }
  h += `<p style="font-size:1.08rem">${def.intro()}</p>`;
  h += `<div class="row small no-print" style="margin:.4rem 0 1rem;gap:.35rem" aria-label="Werkwijze"><span class="pill">🧠 Denk zelf na</span>→<span class="pill">${W('💬 Bespreek samen', '💬 Leg uit aan een klasgenoot')}</span>→<span class="pill">✍️ Vul in</span>→<span class="pill">🤖 Nova vraagt</span>→<span class="pill">✅ Definitief</span></div>`;
  if (st === 'recheck') h += `<div class="banner warn" style="margin-bottom:1rem"><span>! Er is een eerdere keuze aangepast. Klopt deze opdracht nog?</span><button class="btn sm" data-act="clearRecheck" data-n="${n}">👍 Klopt nog</button><button class="btn sm" data-act="reopen" data-n="${n}">✏️ Keuze opnieuw openen</button></div>`;
  const fin = s.progress[n] === 'final';
  h += `<div class="card" id="taskbody">${def.render(C(n))}</div>`;
  if (fin) h += `<div class="donebox" style="margin-top:1.2rem"><h2>● Definitief</h2>${def.summary(F()['t' + n])}<button class="btn" data-act="reopen" data-n="${n}">✏️ Keuze opnieuw openen</button></div>`;
  else if (n !== 8 || APP.tab8 === 'D') h += `<div style="margin-top:1.2rem" class="stack"><div id="missing">${missingBox(n)}</div><button class="btn final" data-act="finalize" data-n="${n}">✅ ${W('Dit is onze definitieve keuze', 'Dit is mijn definitieve keuze')}</button></div>`;
  h += `<div class="row no-print" style="justify-content:space-between;margin-top:1.6rem">${n > 1 ? `<a class="btn" href="#/opdracht/${n - 1}">← Opdracht ${n - 1}</a>` : '<span></span>'}<a class="btn a" href="#/dashboard">🏠 Home</a>${n < 15 ? `<a class="btn ${stat(n + 1) === 'locked' ? 'ghost' : 'p'}" href="#/opdracht/${n + 1}">Opdracht ${n + 1} →</a>` : (s.ui.expertOpen ? '<a class="btn s" href="#/expert">Expertzone →</a>' : '')}</div>`;
  return h;
}
function missingBox(n) {
  const m = TASKS[n].check(C(n));
  return m.length ? `<div class="missing" aria-live="polite"><b>Nog nodig voor definitief:</b><ul>${m.map(x => `<li>${x}</li>`).join('')}</ul></div>` : `<div class="banner" aria-live="polite">✅ Alles is ingevuld. Klaar? Maak het definitief!</div>`;
}

/* ---------- bestanden ---------- */
function viewFiles() {
  const fl = APP.filesFilter; const all = Object.values(S().uploadIndex).sort((a, b) => b.created - a.created); const fids = finalIds();
  const owners = [...new Set(all.map(m => m.owner))];
  const pass = m => fl === 'all' || (fl === 'own' && OWN_KINDS.includes(m.kind)) || (fl === 'digi' && m.kind === 'digitaal') || (fl === 'ai' && m.kind === 'ai') || (fl === 'final' && fids.includes(m.id)) || fl === 'o:' + m.owner;
  const chip = (k, l) => `<button class="chip" data-act="filter" data-f="${k}" aria-pressed="${fl === k}">${l}</button>`;
  const list = all.filter(pass);
  return `<h1>📁 Mijn bestanden</h1><p>Alle uploads op één plek. Definitief kiezen doe ${W('jullie', 'je')} in de opdracht zelf.</p>
  <div class="chips" style="margin-bottom:.6rem">${chip('all', 'Alles')}${chip('own', '✏️ Eigen werk')}${chip('digi', '💻 Digitaal')}${chip('ai', '🤖 AI')}${chip('final', '✓ Definitief')}</div>
  ${owners.length ? `<div class="chips" style="margin-bottom:1rem">${owners.map(o => chip('o:' + o, ownerLabel(o))).join('')}</div>` : ''}
  ${list.length ? `<div class="files">${list.map(m => fileCard(m, { lib: true })).join('')}</div>` : `<div class="card tint3"><p style="font-size:1.1rem;margin:0">📭 Hier is nog niets. ${all.length ? 'Probeer een ander filter.' : `Upload ${W('jullie', 'je')} eerste schets bij opdracht 8, 9 of 10!`}</p></div>`}`;
}

  chip3: el => { const c = C(6); const v = el.dataset.v; c.three = c.three || []; if (c.three.includes(v)) c.three = c.three.filter(x => x !== v); else if (c.three.length < 3) c.three.push(v); else { toast('Je hebt er al drie. Haal er eerst één weg.'); return; } markTouched('t6'); save(); render(); },
  addValue: () => { const c = C(6); const v = String(c.custom || '').trim().toLowerCase(); if (!v) { toast('Typ eerst een eigen kernwaarde.'); return; } c.five = c.five || []; if (c.five.includes(v)) return; if (c.five.length >= 5) { toast('Je hebt er al vijf. Haal er eerst één weg.'); return; } c.five.push(v); c.custom = ''; markTouched('t6'); save(); render(); },
  tab8: el => { APP.tab8 = el.dataset.t; render(); },
  role8: el => { APP.role8 = el.dataset.r; render(); },
  swatch: el => { setColor(APP.role8, el.dataset.c); },
  font: el => { bindSet('t8.font', el.dataset.f, true); },
  sub8done: el => { const t = el.dataset.t; if (S().progress[8] === 'final') { APP.tab8 = { A: 'B', B: 'C', C: 'D' }[t]; render({ top: true }); return; } const miss = sub8Check(t, C(8)); if (miss.length) { modal({ title: 'Nog niet klaar', body: `<ul>${miss.map(m => `<li>${m}</li>`).join('')}</ul>` }); return; } S().sub8[t] = 'klaar'; markTouched('t8'); APP.tab8 = { A: 'B', B: 'C', C: 'D' }[t]; save(); render({ top: true }); toast('✓ ' + t + ' klaar!'); },
  upPick: el => pickFile(null, false, f => addUploadSmart(f, el.dataset)),
  upCam: el => pickFile('image/*', true, f => addUploadSmart(f, el.dataset)),
  fmenu: el => { const open = el.parentElement.querySelector('.menu'); closeMenus(); if (open) return; const id = el.dataset.id; el.setAttribute('aria-expanded', 'true'); el.insertAdjacentHTML('afterend', `<div class="menu" role="menu"><button data-act="fview" data-id="${id}">👁 Bekijken</button><button data-act="dlFile" data-id="${id}">⬇ Downloaden</button><button data-act="frep" data-id="${id}">🔁 Vervangen</button><button data-act="fdel" data-id="${id}">🗑 Verwijderen</button></div>`); el.nextElementSibling.querySelector('button').focus(); },
  fview: el => { closeMenus(); viewFile(el.dataset.id); }, viewFile: el => viewFile(el.dataset.id),
  dlFile: el => { closeMenus(); if (el.dataset.id) downloadFile(el.dataset.id); },
  frep: el => { closeMenus(); pickFile(null, false, f => replaceUpload(el.dataset.id, f)); },
  fdel: el => { closeMenus(); deleteUpload(el.dataset.id); },
  dlOthers: async () => { const f = F(); const ids = finalIds().filter(id => id !== f.t9?.logoId && id !== f.t10?.protoId); for (const id of ids) { await downloadFile(id); await new Promise(r => setTimeout(r, 600)); } },
  copyPrompt: el => copyText($('#' + el.dataset.w).textContent),
  dlPrompt: el => downloadText(`${slug(companyName())}-${el.dataset.w === 'wp' ? 'websiteprompt' : 'afbeeldingsprompt'}.txt`, $('#' + el.dataset.w).textContent),
  rebuildPrompts: () => { render(); toast('🔄 Prompts opnieuw samengesteld met de nieuwste definitieve keuzes.'); },
  joinParts: async () => { const c = C(12); const t = ['p1', 'p2', 'p3', 'p4', 'p5'].map(k => (c[k] || '').trim()).filter(Boolean).join(' '); if (!t) { toast('Vul eerst de bouwstenen in.'); return; } if (!blank(c.tekst) && !(await confirmBox('Tekst vervangen?', 'Er staat al tekst in het vak. Wil je die vervangen door de bouwstenen?', 'Ja, vervang', 'Nee'))) return; bindSet('t12.tekst', t, true); },
  openChosenTask: () => { const n = C(11).openTask; if (!n) { toast('Kies eerst een opdracht.'); return; } nav('#/opdracht/' + n); },
  filter: el => { APP.filesFilter = el.dataset.f; render(); },
  pm: el => { APP.pmSlide += +el.dataset.d; render(); },
  fullscreen: () => { const d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen().catch(() => toast('Volledig scherm lukt niet in deze browser.')); },
  completeMission: el => completeMission(el.dataset.k),
  reopenMission: el => reopenMission(el.dataset.k),
  lockedTile: el => toast('🔒 ' + el.dataset.msg),
  novaToggle: () => { APP.novaOpen = !APP.novaOpen; renderNova(ctxNow()); },
  novaNext: () => { APP.novaIdx++; renderNova(ctxNow()); },
  novaSave: async () => { const a = ($('#novaAns')?.value || '').trim(); if (!a) { toast('Schrijf eerst iets op.'); return; } const q = $('.novabox .q')?.textContent || ''; S().chatbotHistory.push({ at: Date.now(), where: curHash(), q, a }); save(); toast('🤖 Nova: Goed nagedacht! Pas ' + W('jullie', 'je') + ' antwoord in de opdracht aan als dat nodig is.'); APP.novaIdx++; renderNova(ctxNow()); },
  backup: () => { closeMenus(); doBackup(S(), APP.mode); },
  restore: () => { closeMenus(); doRestore(); },
  wipe: async () => { closeMenus(); if (!(await confirmBox('Alles verwijderen?', 'Hiermee verwijder je het hele project met alle bestanden van deze laptop. Download eerst een back-up als je het wilt bewaren.', 'Ja, verwijderen', 'Nee', true))) return; if (!(await confirmBox('Echt zeker?', 'Dit kan niet ongedaan worden gemaakt. Laatste kans!', 'Ja, verwijder alles', 'Nee, stop', true))) return; await wipeMode('real'); APP.s = null; store.del(ACTIVE); nav('#/start'); toast('🗑 Alle projectgegevens zijn verwijderd.'); },
  resume: async () => { const st = loadMode('real'); if (!st) { const r = await modal({ title: 'Geen project gevonden', body: '<p>Geen project gevonden. Misschien werk je in een andere browser dan vorige keer, of in een incognitovenster.</p><p>Heb je een back-up? Zet die dan terug.</p>', buttons: [{ label: 'Sluiten', value: 0 }, { label: '📥 Back-up terugzetten', cls: 'p', value: 1 }] }); if (r) doRestore(); return; } openMode('real', st); },
  demo: async () => { let st = loadMode('demo'); if (!st) st = await seedDemo(); openMode('demo', st); },
  demoReset: async () => { closeMenus(); if (!(await confirmBox('Demo resetten?', 'Alle wijzigingen in de demo worden teruggezet. Je echte project blijft gewoon staan.', 'Ja, resetten', 'Nee'))) return; await wipeMode('demo'); const st = await seedDemo(); openMode('demo', st); toast('↺ Demo is teruggezet.'); },
  sfAdd: () => { APP.sf.members.push({ name: '', title: '' }); render(); },
  sfDel: el => { APP.sf.members.splice(+el.dataset.i, 1); render(); }
};
Object.assign(ACT, MB_ACT);
function closeMenus() { $$('.menu').forEach(m => m.remove()); $$('[aria-expanded="true"][data-act="menu"],[aria-expanded="true"][data-act="fmenu"]').forEach(b => b.setAttribute('aria-expanded', 'false')); }
function setColor(role, hex) {
  if (!hexOk(hex)) return; setP(S().concept, 't8.' + role, hex.toUpperCase()); markTouched('t8'); save();
  if (APP.role8 === role) { const order = ['c1', 'c2', 'c3']; const next = order.find(r => !hexOk(C(8)[r])); if (next) APP.role8 = next; }
  render();
}
function addUploadSmart(file, ds) {
  addUpload(file, { owner: ds.owner, slot: ds.slot, kind: ds.kind }).then(() => {
    if (ds.slot === 'moodboard' && ds.owner === 't8') { const last = filesOf('t8', 'moodboard').pop(); if (last && !C(8).moodboardId) { C(8).moodboardId = last.id; save(); render(); } }
  });
}

/* ================= BACK-UP ================= */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function dataURLtoBlob(u) { const [h, d] = u.split(','); const mime = (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream'; const bin = atob(d); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type: mime }); }
async function doBackup(state, mode) {
  toast('💾 Back-up wordt gemaakt…');
  const files = {};
  for (const id of Object.keys(state.uploadIndex || {})) { try { const b = await DB.get(mode + ':' + id); if (b) files[id] = await blobToDataURL(b); } catch (e) { } }
  const name = state.final?.t7?.name || state.team.temporaryProjectName;
  const d = new Date(); const ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  downloadText(`StartupLab-backup-${slug(name)}-${ds}.json`, JSON.stringify({ app: 'StartupLab', kind: 'backup', dataVersion: DATA_VERSION, exportedAt: d.toISOString(), state, files }), 'application/json');
  state.ui.lastBackup = Date.now();
  try { store.set(LS(mode), JSON.stringify(state)); } catch (e) { }
  toast('✅ Back-up gedownload. Zet het bestand in je OneDrive of Teams-map.');
  if (S() === state) render();
}
function doRestore() {
  pickFile('.json,application/json', false, async file => {
    let obj; try { obj = JSON.parse(await file.text()); } catch (e) { obj = null; }
    if (!obj || obj.app !== 'StartupLab' || !obj.state || obj.state.meta?.app !== 'StartupLab' || typeof obj.state.team !== 'object') { await modal({ title: 'Dit is geen StartupLab-back-up', body: '<p>Kies een bestand dat begint met <b>StartupLab-backup-</b> en eindigt op <b>.json</b>.</p>' }); return; }
    const st = migrate(obj.state); if (!st) { await modal({ title: 'Back-up beschadigd', body: '<p>Deze back-up kan niet worden gelezen.</p>' }); return; }
    const existing = loadMode('real'); const nm = st.final?.t7?.name || st.team.temporaryProjectName;
    let done = 0; for (let i = 1; i <= 15; i++) if (st.progress[i] === 'final') done++;
    const ok = await modal({ title: '📥 Back-up terugzetten?', body: `<div class="card flat"><p style="margin:0"><b>${esc(nm)}</b></p><p class="small" style="margin:.3rem 0">${st.team.members.map(m => esc(m.name) + ' – ' + esc(m.title)).join('<br>')}</p><p class="small muted" style="margin:0">Back-up van ${fmtDate(Date.parse(obj.exportedAt))} ${fmtTime(Date.parse(obj.exportedAt))} · ${done} van 15 definitief · ${Object.keys(obj.files || {}).length} bestanden</p></div>${existing ? `<p class="banner warn" style="margin-top:1rem">⚠ Het huidige project „${esc(existing.final?.t7?.name || existing.team.temporaryProjectName)}” op deze laptop wordt vervangen.</p>` : ''}`, buttons: [{ label: 'Annuleren', value: false }, { label: '📥 Ja, zet terug', cls: 'p', value: true }] });
    if (!ok) return;
    await wipeMode('real');
    for (const [id, data] of Object.entries(obj.files || {})) { try { await DB.put('real:' + id, dataURLtoBlob(data)); } catch (e) { } }
    for (const id of Object.keys(st.uploadIndex)) if (!(obj.files || {})[id]) delete st.uploadIndex[id];
    st.meta.isDemo = false;
    openMode('real', st); toast('✅ Back-up teruggezet. Welkom terug!');
  });
}
async function wipeMode(mode) {
  try { const keys = await DB.keys(); for (const k of keys) if (String(k).startsWith(mode + ':')) await DB.del(k); } catch (e) { }
  store.del(LS(mode)); Object.keys(URLS).forEach(dropUrl);
}
function openMode(mode, st) {
  Object.keys(URLS).forEach(dropUrl);
  APP.mode = mode; APP.s = st; APP.tab8 = 'A'; APP.novaOpen = false;
  store.set(ACTIVE, mode); save(true); askPersist();
  nav('#/dashboard');
}
async function startNew(ev) {
  ev.preventDefault();
  const sf = APP.sf; const err = [];
  const ms = sf.members.map(m => ({ name: m.name.trim(), title: m.title.trim() }));
  if (!ms[0].name) err.push('naam van leerling 1'); if (!ms[0].title) err.push('functietitel van leerling 1');
  ms.slice(1).forEach((m, i) => { if (m.name && !m.title) err.push(`functietitel van leerling ${i + 2}`); if (!m.name && m.title) err.push(`naam van leerling ${i + 2}`); });
  if (!sf.className.trim()) err.push('klas'); if (!sf.proj.trim()) err.push('tijdelijke projectnaam');
  if (err.length) { $('#sferr').innerHTML = `<div class="missing" style="margin-bottom:1rem"><b>Vul nog in:</b><ul>${err.map(x => `<li>${x}</li>`).join('')}</ul></div>`; return; }
  const existing = loadMode('real');
  if (existing) {
    const r = await modal({ title: 'Er staat al een project', body: `<p>Op deze laptop staat al het project <b>„${esc(existing.final?.t7?.name || existing.team.temporaryProjectName)}”</b>. Als je een nieuw project start, wordt dat vervangen.</p><p>Download eerst een back-up als je het wilt bewaren.</p>`, buttons: [{ label: 'Annuleren', value: 0 }, { label: '💾 Eerst back-up', value: 2 }, { label: 'Vervangen', cls: 'danger', value: 1 }] });
    if (r === 2) { await doBackup(existing, 'real'); return; }
    if (r !== 1) return;
    await wipeMode('real');
  }
  const team = { members: ms.filter(m => m.name), className: sf.className.trim(), temporaryProjectName: sf.proj.trim() };
  APP.sf = null;
  openMode('real', newState(team)); confetti(); toast(`🚀 Welkom bij StartupLab, ${esc(team.members.map(m => m.name).join(' & '))}!`);
}

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#/"]');
  if (link && !e.ctrlKey && !e.metaKey && !e.shiftKey) { e.preventDefault(); nav(link.getAttribute('href')); return; }
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('.menu')) closeMenus(); return; }
  if (el.disabled) return;
  if (!['menu', 'fmenu'].includes(el.dataset.act) && !el.closest('.menu')) closeMenus();
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.sf != null) { setP(APP.sf, t.dataset.sf, t.value); return; }
  if (t.dataset.cap) { const m = S().uploadIndex[t.dataset.cap]; if (m) { m.caption = t.value; save(); } return; }
  if (t.dataset.hex) { if (hexOk(t.value.trim())) setColor(t.dataset.hex, t.value.trim()); return; }
  if (t.dataset.color) { clearTimeout(APP.colTimer); APP.colTimer = setTimeout(() => setColor(t.dataset.color, t.value), 250); return; }
  if (t.dataset.mbpick) { clearTimeout(APP.colTimer); APP.colTimer = setTimeout(() => { setP(S().concept, t.dataset.mbpick, t.value.toUpperCase()); mbTouch(); save(); render(); }, 250); return; }
  if (t.dataset.mbtext != null) { const w = document.querySelector(`[data-mbcell="${t.dataset.mbtext}"] .mbw`); if (w) w.textContent = t.value; mbTouch(); }
  if (t.dataset.bind && !['checkbox', 'radio'].includes(t.type) && t.tagName !== 'SELECT') bindSet(t.dataset.bind, t.value, false);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.own) { const [k, f] = t.dataset.own.split('.'); S().ownWorkChecks[k] = S().ownWorkChecks[k] || {}; S().ownWorkChecks[k][f] = t.checked; markTouched(k); save(); render(); return; }
  if (t.dataset.multi) { const arr = new Set(cv(t.dataset.multi) || []); t.checked ? arr.add(t.value) : arr.delete(t.value); bindSet(t.dataset.multi, [...arr], t.hasAttribute('data-rerender')); return; }
  if (!t.dataset.bind) return;
  if (t.dataset.mbtext != null) { render(); return; }
  if (/^t(2|5|7)\.(ideas|slogans|names)\.\d+\.(name|text)$/.test(t.dataset.bind)) { render(); return; }
  if (t.type === 'checkbox') bindSet(t.dataset.bind, t.checked, false);
  else if (t.type === 'radio') bindSet(t.dataset.bind, t.value, t.hasAttribute('data-rerender'));
  else if (t.tagName === 'SELECT') bindSet(t.dataset.bind, t.value, t.dataset.bind.startsWith('ex_markt'));
});
document.addEventListener('submit', e => { if (e.target.id === 'startform') startNew(e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMenus(); $('.drawer')?.remove(); if (APP.novaOpen) { APP.novaOpen = false; renderNova(ctxNow()); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.drop')) { e.preventDefault(); e.target.click(); }
  if (routeOf().a === 'pitchmarkt' && !e.target.matches('input,textarea')) { if (e.key === 'ArrowRight') { APP.pmSlide++; render(); } if (e.key === 'ArrowLeft') { APP.pmSlide = Math.max(0, APP.pmSlide - 1); render(); } }
});
document.addEventListener('dragover', e => { const d = e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest('[data-drop]'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest('[data-drop]'); if (!d) return; e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) addUploadSmart(f, d.dataset); });
window.addEventListener('hashchange', () => { if (location.hash && location.hash !== APP.route) { APP.route = location.hash; closeMenus(); $('.drawer')?.remove(); render({ top: true }); } });
window.addEventListener('popstate', () => { if (location.hash !== APP.route) { APP.route = location.hash; closeMenus(); render({ top: true }); } });
window.addEventListener('pagehide', () => { if (S() && saveTimer) save(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S() && saveTimer) save(true); });
window.addEventListener('storage', e => { if (APP.mode && e.key === LS(APP.mode) && e.newValue) { try { APP.s = migrate(JSON.parse(e.newValue)); render(); } catch (x) { } } });

/* ================= START ================= */
(async function boot() {
  await checkStorage();
  const mode = store.get(ACTIVE);
  if (mode) { const st = loadMode(mode); if (st) { APP.mode = mode; APP.s = st; } }
  APP.route = location.hash && location.hash.startsWith('#/') ? location.hash : (APP.s ? '#/dashboard' : '#/start');
  try { if (location.hash !== APP.route) history.replaceState(null, '', APP.route); } catch (e) { }
  render({ top: true });
  if (APP.s) askPersist();
})();

</script>
